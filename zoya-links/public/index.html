<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ZOYA | Links</title>
  <meta name="description" content="Latest releases, DJ sets and social links from ZOYA.">
  <meta name="theme-color" content="#070506">

  <meta property="og:type" content="website">
  <meta property="og:title" content="ZOYA | Links">
  <meta property="og:description" content="Latest releases, DJ sets and social links from ZOYA.">
  <meta property="og:url" content="https://links.zoyasmusic.com/">
  <meta property="og:image" content="https://links.zoyasmusic.com/images/zoya.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="page">
    <header class="hero">
      <img class="hero__img" id="heroImg" src="/images/zoya.jpg" alt="Portrait of ZOYA"
           fetchpriority="high" onerror="this.remove()">
      <div class="hero__scrim"></div>
      <div class="hero__body">
        <h1 class="hero__name" id="name"><img class="hero__logo" id="logo" src="/images/zoya-logo.png" alt="ZOYA" width="900" height="300" fetchpriority="high" onerror="this.parentNode.classList.add('is-text');this.replaceWith(this.alt)"></h1>
        <p class="hero__handle" id="handle">@zoyasmusic</p>
        <ul class="socials" id="socials" aria-label="Social links"></ul>
      </div>
    </header>

    <div class="bio" id="bio"></div>

    <div class="content">
      <a class="featured skeleton" id="featured" aria-busy="true"></a>

      <section class="block" id="releases" aria-labelledby="releases-title">
        <div class="block__head">
          <h2 class="block__title" id="releases-title">Latest releases</h2>
          <a class="block__link" id="releases-link" href="#" target="_blank" rel="noopener" hidden>All on Spotify</a>
        </div>
        <div class="rail" id="releases-rail">
          <div class="release release--ghost"><span class="release__art skeleton"></span></div>
          <div class="release release--ghost"><span class="release__art skeleton"></span></div>
          <div class="release release--ghost"><span class="release__art skeleton"></span></div>
        </div>
      </section>

      <section class="block" id="sets" aria-labelledby="sets-title">
        <div class="block__head">
          <h2 class="block__title" id="sets-title">Latest sets</h2>
          <a class="block__link" id="sets-link" href="#" target="_blank" rel="noopener" hidden>All on YouTube</a>
        </div>
        <div class="sets" id="sets-list">
          <div class="set set--lead"><span class="set__thumb skeleton"></span></div>
        </div>
      </section>
    </div>

    <footer class="foot" id="foot"></footer>
  </main>

  <dialog class="popup" id="popup" aria-labelledby="popup-title">
    <div class="popup__inner">
      <button class="popup__close" id="popup-close" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
      <img class="popup__cover" id="popup-cover" src="" alt="" width="640" height="640">
      <h2 class="popup__title" id="popup-title"></h2>
      <p class="popup__artist" id="popup-artist"></p>
      <p class="popup__label">Listen on</p>
      <div class="popup__links" id="popup-links"></div>
    </div>
  </dialog>

  <noscript><p style="text-align:center;padding:2rem;color:#fff">Turn on JavaScript to see ZOYA's latest releases and sets.</p></noscript>
  <script src="/app.js" defer></script>
</body>
</html>
