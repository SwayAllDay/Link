<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZOYA | Stats</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070506">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/stats.css">
</head>
<body>
  <main class="wrap">
    <h1>Link page stats</h1>

    <form id="gate" class="gate">
      <label for="key">Password</label>
      <input id="key" type="password" autocomplete="current-password" placeholder="Enter password">
      <button type="submit">View</button>
      <p class="gate__error" id="gateError" hidden></p>
    </form>

    <div id="dash" class="dash" hidden>
      <div class="rangebar">
        <div class="range" id="range">
          <button data-days="7">7 days</button>
          <button data-days="30" class="is-active">30 days</button>
          <button data-days="90">90 days</button>
        </div>
        <button id="signOut" class="signout">Sign out</button>
      </div>

      <div id="loading" class="loading">Loading…</div>
      <div id="error" class="error" hidden></div>

      <div id="content" hidden>
        <div class="cards">
          <div class="card"><div class="card__num" id="numViews">–</div><div class="card__label">Page views</div></div>
          <div class="card"><div class="card__num" id="numClicks">–</div><div class="card__label">Link clicks</div></div>
          <div class="card"><div class="card__num" id="numCountries">–</div><div class="card__label">Countries</div></div>
        </div>

        <section class="block">
          <h2>Views per day</h2>
          <div id="dailyChart" class="bars bars--days"></div>
        </section>

        <section class="block">
          <h2>Device</h2>
          <div id="deviceRows" class="rows"></div>
        </section>

        <section class="block">
          <h2>Top countries</h2>
          <div id="countryRows" class="rows"></div>
        </section>

        <section class="block">
          <h2>Most-opened releases</h2>
          <div id="releaseRows" class="rows"></div>
        </section>

        <section class="block">
          <h2>Listen-on clicks, by platform</h2>
          <div id="platformRows" class="rows"></div>
        </section>

        <section class="block">
          <h2>Most-clicked sets</h2>
          <div id="setRows" class="rows"></div>
        </section>

        <section class="block">
          <h2>Social icon clicks</h2>
          <div id="socialRows" class="rows"></div>
        </section>
      </div>
    </div>
  </main>

  <script src="/stats.js" defer></script>
</body>
</html>
